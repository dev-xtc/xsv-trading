<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XSV Trading</title>
<link rel="icon" href="favicon.ico" type="image/ico">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body{
  font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
  background:#0b0b0b;
  color:#e5e5e5;
  line-height:1.6;
  overflow-x:hidden;
  text-align:center;
  opacity:0;
  transition: opacity 1.2s ease-out;

  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== Page layout ===== */
.page-content{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:40px 20px;
}

/* ===== Chart Canvas ===== */
#chartCanvas{
  position:fixed;
  top:100px;
  left:0;
  width:100%;
  height:calc(100vh - 100px);
  z-index:-1;
  opacity:0.2;
}

/* ===== Background Blur Overlay ===== */
#chartBlur {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  z-index:0;
  backdrop-filter: blur(4px);
  pointer-events:none;
  opacity:0.3;
}

/* ===== Logo ===== */
.logo{
  font-size:60px;
  font-weight:900;
  letter-spacing:10px;
  text-align:center;
  background: linear-gradient(
    120deg,
    #ffffff 0%,
    #888888 15%,
    #ffffff 30%,
    #bbbbbb 50%,
    #ffffff 70%,
    #999999 85%,
    #ffffff 100%
  );
  background-size:300% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: metallicGlint 1.5s linear infinite;
  text-shadow: 0 0 12px rgba(255,255,255,0.6),
               0 0 18px rgba(180,200,255,0.3),
               0 0 24px rgba(120,200,255,0.2);
  margin-bottom:50px;
}

@keyframes metallicGlint{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ===== Hero ===== */
.hero{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  max-width:800px;
  margin:0 auto;
  padding:0 20px;
  box-sizing:border-box;
  opacity:0;
  transform:translateY(30px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}

.hero.visible {
  opacity:1;
  transform:translateY(0);
}

.hero h1{
  font-size:48px;
  font-weight:500;
  letter-spacing:-0.5px;
  word-break:break-word;
  color:#f0f0f0;
}

.hero p{
  margin-top:24px;
  font-size:17px;
  color:#888;
  max-width:520px;
}

@media(max-width:768px){
  .hero h1{ font-size:34px; }
  .logo{ font-size:42px; letter-spacing:6px; margin-bottom:36px; }
  .hero p{ font-size:15px; }
}

/* ===== Footer ===== */
footer{
  padding:24px 8%;
  font-size:12px;
  color:#555;
  text-align:center;
  opacity:0;
  transform:translateY(30px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}

footer.visible {
  opacity:1;
  transform:translateY(0);
}

.tos-link{
  color:#666;
  font-size:12px;
  text-decoration:none;
  transition:color 0.3s ease;
}

.tos-link:hover{
  color:#e5e5e5;
}
</style>
</head>
<body>

<div class="page-content">

  <canvas id="chartCanvas"></canvas>
  <div id="chartBlur"></div>

  <div class="logo">XSV TRADING</div>

  <section class="hero fade-up">
    <h1>WEBSITE UNDER MAINTENANCE</h1>
    <p>We're making a few improvements behind the scenes. XSV Trading will be back - thanks for your patience.</p>
  </section>

</div>

<footer class="fade-up">
  © 2026 XSV Trading — xlusive.
  <span style="margin:0 8px; color:#333;">•</span>
  <a href="https://xsv.trading/journal" class="tos-link">Trade Journal</a>
  <span style="margin:0 8px; color:#333;">•</span>
  <a href="https://xsv.trading/tos" class="tos-link">Terms of Service</a>
</footer>

<script>
/* ===== Fade-in on Load ===== */
window.addEventListener('load', () => {
  document.body.style.opacity = '1';
  document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible'));
});

/* ===== Candlestick Chart Background ===== */
const canvas = document.getElementById("chartCanvas");
const ctx = canvas.getContext("2d");

let candleWidth = 12;
let gap = 6;
let basePrice, xPos, trendDirection, trendCounter, trendLength;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  basePrice = canvas.height * 0.45;
  xPos = 0;
  trendDirection = 1;
  trendCounter = 0;
  trendLength = 3 + Math.floor(Math.random() * 5);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function addCandle() {
  if (xPos > canvas.width) return;

  const open = basePrice;
  let change = trendDirection * (25 + Math.random() * 35);
  let close = basePrice + change;
  close = Math.max(2, Math.min(canvas.height - 2, close));

  const wickSize = 20 + Math.random() * 10;
  const high = Math.min(Math.max(open, close) + wickSize, canvas.height - 2);
  const low = Math.max(Math.min(open, close) - wickSize, 2);

  const bull = close > open;
  const color = bull ? "rgba(230,230,230,1)" : "rgba(120,200,255,1)";
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;

  const bodyTop = Math.min(open, close);
  const bodyHeight = Math.max(Math.abs(close - open) * 1.4, 2);

  ctx.beginPath();
  ctx.moveTo(xPos + candleWidth / 2, high);
  ctx.lineTo(xPos + candleWidth / 2, low);
  ctx.stroke();

  ctx.fillRect(xPos, bodyTop, candleWidth, bodyHeight);

  basePrice = close;
  xPos += candleWidth + gap;

  trendCounter++;
  if (trendCounter >= trendLength) {
    trendDirection *= -1;
    trendCounter = 0;
    trendLength = 3 + Math.floor(Math.random() * 5);
  }
}

let lastTime = 0;
function drawAllCandles(time) {
  if (!lastTime) lastTime = time;
  if (time - lastTime > 120) {
    if (xPos <= canvas.width) addCandle();
    lastTime = time;
  }
  requestAnimationFrame(drawAllCandles);
}
requestAnimationFrame(drawAllCandles);
</script>

</body>
</html>
